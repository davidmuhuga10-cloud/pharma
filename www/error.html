<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharma</title>
<style>
html,body{margin:0;height:100%}
body{background:#0F5132;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
.box{padding:24px;max-width:320px}
.logo{width:64px;height:64px;border-radius:18px;background:#C42B23;box-shadow:0 0 0 3px #fff;display:grid;place-items:center;margin:0 auto 20px}
.logo svg{width:42px;height:42px;display:block}
h1{font-size:20px;margin:0 0 8px}
p{font-size:15px;margin:0 0 22px;color:#fff}
button{background:#fff;color:#201E1B;border:0;border-radius:10px;font-size:16px;font-weight:700;padding:13px 28px}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><polygon points="18,6 30,6 30,18 42,18 42,30 30,30 30,42 18,42 18,30 6,30 6,18 18,18" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg></div>
  <h1>No internet connection</h1>
  <p>Check your data or Wi-Fi.</p>
  <button type="button" id="retry">Try again</button>
</div>
<script>
document.getElementById('retry').onclick = function () { window.location.replace('https://pharmacymngt.netlify.app/'); };
window.addEventListener('online', function () { window.location.replace('https://pharmacymngt.netlify.app/'); });
</script>
</body>
</html>
